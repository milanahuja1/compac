<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
    <meta charset="UTF-8">
    <title>EV Car Console</title>
    <h1> EV Car Console</h1>
</head>
<body>
<div class="topContainer">
<h2>Battery Charging status:  </h2>
    <h2 id ="chargingStatusLabel"> Not charging </h2>
</div>

<div class="topContainer">
    <h2>Battery Level:  </h2>
    <h2 id ="batteryLevelLabel"> 100% </h2>
</div>


<div class="bottomContainer">
    <button id="batteryToggleButton">Charging Button</button>
</div>

<div class="schedule-card">
    <h3>Battery Charging Schedule</h3>
    
    <label>Target Time (24h):</label>
    <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 10px;">
        <select id="scheduleHourInput"></select>
        <span>:</span>
        <select id="scheduleMinuteInput"></select>
    </div>

    <button id="saveScheduleButton">Save Schedule</button>
    <span id="scheduleStatusLabel"></span>
</div>

</body>
</html>
